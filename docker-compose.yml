services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://nexus:nexus_dev_password@postgres:5432/nexus
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/support-escalation
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_started}
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: nexus, POSTGRES_PASSWORD: nexus_dev_password, POSTGRES_DB: nexus}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    volumes: [n8n_data:/home/node/.n8n]
volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
